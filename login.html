<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 보드게임 점수 계산기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css?v=20260903-auth2">
</head>
<body class="auth-page" data-auth-page="login">
  <main class="auth-page-shell">
    <section class="auth-page-card" aria-labelledby="login-title">
      <div class="auth-brand" aria-hidden="true">🎲</div>
      <h1 id="login-title">로그인</h1>
      <p class="auth-lead">내 게임 기록과 친구 상태를 확인해요.</p>
      <form id="login-form" novalidate>
        <label class="account-field">아이디
          <input id="login-id" name="username" type="text" autocomplete="username" maxlength="20" autocapitalize="none" required>
        </label>
        <label class="account-field">비밀번호
          <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button class="btn block" id="login-submit" type="submit">로그인</button>
      </form>
      <p class="account-feedback" id="auth-message" role="status"></p>
      <p class="account-note">아이디·비밀번호 찾기는 제공하지 않아요.</p>
      <div class="auth-divider"><span>또는</span></div>
      <button class="btn ghost block guest-login-btn" id="guest-login" type="button">게스트로 이용하기</button>
      <p class="account-note guest-note">게스트 기록은 이 브라우저에만 보관되며 친구·랭킹에는 반영되지 않아요.</p>
      <div class="auth-page-switch">계정이 없나요? <a href="signup.html">회원가입</a></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js?v=20260903-auth2" defer></script>
  <script src="auth.js?v=20260908-auth8" defer></script>
</body>
</html>
